services:

  app:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    container_name: nestjs_app
    restart: always
    volumes:
      - ./:/home/www-data/app
      - /home/www-data/app/node_modules
      - /home/www-data/app/.pnpm-store
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:17.1-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: database_user
      POSTGRES_PASSWORD: database_pass
      POSTGRES_DB: wasiyah_db
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=fr
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
